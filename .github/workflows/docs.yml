name: Deploy Docs to GitHub Pages

on:
  push:
    branches: [ main ]
  # Dispatchable on any branch to verify the docs build. The deploy job below
  # is gated on `push`, so a manual run from a feature branch builds the docs
  # without publishing them.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # espup queries the GitHub API; an unauthenticated runner hits the rate limit.
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # Pin the Xtensa Rust version instead of tracking `latest`.
  #
  # 1.95.0.0 turned `panic_immediate_abort` from a build-std feature into a
  # real panic strategy, so the `build-std-features` line in .cargo/config.toml
  # makes `core` fail to compile there:
  #   "panic_immediate_abort is now a real panic strategy!"
  # 1.88.0.0 is what the project is developed against. Moving to 1.95+ means
  # dropping build-std-features and setting `panic = "immediate-abort"` in
  # Cargo.toml instead -- a deliberate change, not a silent CI-only drift.
  XTENSA_RUST_VERSION: 1.88.0.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `dtolnay/rust-toolchain@stable` cannot build this crate: Xtensa is not
      # an upstream Rust target, and rust-toolchain.toml pins `channel = "esp"`.
      # This action installs espup + Espressif's Rust fork.
      - name: Install Rust for Xtensa
        uses: esp-rs/xtensa-toolchain@ec6d36527049a7f4fb2cb0c1a644668c1bb8a2a4 # v1.7.0
        with:
          version: ${{ env.XTENSA_RUST_VERSION }}
          buildtargets: esp32s3
          ldproxy: true   # required for std / ESP-IDF linking
          default: true

      - name: Install ESP-IDF dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git wget flex bison gperf python3 python3-pip python3-setuptools cmake ninja-build ccache libffi-dev libssl-dev dfu-util

      - name: Cache cargo + ESP-IDF
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # .embuild is where esp-idf-sys checks out ESP-IDF (the version comes
          # from ESP_IDF_VERSION in .cargo/config.toml -- do NOT re-declare it
          # as a step env var here, that silently pins a different ESP-IDF).
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .embuild
            target
          key: ${{ runner.os }}-esp-docs-${{ hashFiles('**/Cargo.lock', '.cargo/config.toml') }}
          restore-keys: |
            ${{ runner.os }}-esp-docs-

      - name: Build documentation
        env:
          # Was `$(pwd)/sdkconfig.defaults`, which is not expanded in a YAML env
          # block and was passed to esp-idf-sys as a literal string.
          ESP_IDF_SDKCONFIG_DEFAULTS: ${{ github.workspace }}/sdkconfig.defaults
          RUSTDOCFLAGS: --enable-index-page -Zunstable-options
        run: cargo doc --no-deps --document-private-items

      - name: Add index redirect
        run: |
          echo '<meta http-equiv="refresh" content="0; url=esp32_s3_display_dashboard/index.html">' > target/xtensa-esp32s3-espidf/doc/index.html

      - name: Setup Pages
        if: github.event_name == 'push'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./target/xtensa-esp32s3-espidf/doc

  deploy:
    # Only publish from main. A workflow_dispatch run on a feature branch stops
    # after the build job, which is what makes the docs build verifiable in CI.
    if: github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
