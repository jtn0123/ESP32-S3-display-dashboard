name: Binary Size Tracking

on:
  pull_request:
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.rs'
      - 'rust-toolchain.toml'
      - '.cargo/config.toml'
      - '.github/workflows/binary-size.yml'

# Default-deny for the whole workflow; the one job re-grants the write it needs
# below. Without this, jobs inherit the repository default, which can be
# read/write.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # espup queries the GitHub API; an unauthenticated runner hits the rate limit.
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # Pin the Xtensa Rust version instead of tracking `latest`.
  #
  # 1.95.0.0 turned `panic_immediate_abort` from a build-std feature into a
  # real panic strategy, so the `build-std-features` line in .cargo/config.toml
  # makes `core` fail to compile there:
  #   "panic_immediate_abort is now a real panic strategy!"
  # 1.88.0.0 is what the project is developed against. Moving to 1.95+ means
  # dropping build-std-features and setting `panic = "immediate-abort"` in
  # Cargo.toml instead -- a deliberate change, not a silent CI-only drift.
  XTENSA_RUST_VERSION: 1.88.0.0

jobs:
  size-check:
    name: Track Binary Size
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The "Comment PR" step below posts/updates a review comment via
      # actions/github-script. Without this the default-deny above would make
      # that step fail with 403.
      pull-requests: write
    steps:
    - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
      with:
        fetch-depth: 0

    # Upstream stable Rust has no Xtensa target; this needs Espressif's fork
    # via espup. The target itself is xtensa-esp32s3-espidf (std / ESP-IDF) and
    # comes from `[build] target` in .cargo/config.toml, so no --target flag.
    - name: Install Rust for Xtensa
      uses: esp-rs/xtensa-toolchain@ec6d36527049a7f4fb2cb0c1a644668c1bb8a2a4 # v1.7.0
      with:
        version: ${{ env.XTENSA_RUST_VERSION }}
        buildtargets: esp32s3
        ldproxy: true
        default: true

    - name: Cache cargo + ESP-IDF
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          .embuild
          target
        key: ${{ runner.os }}-esp-size-${{ hashFiles('**/Cargo.lock', '.cargo/config.toml') }}
        restore-keys: |
          ${{ runner.os }}-esp-size-

    - name: Build current branch
      run: |
        cargo build --release
        cp target/xtensa-esp32s3-espidf/release/esp32-s3-dashboard current-binary

    - name: Checkout base branch
      env:
        # Interpolating github.base_ref straight into the script would be a
        # shell-injection sink; pass it through the environment instead.
        BASE_REF: ${{ github.base_ref }}
      run: git checkout --detach "origin/${BASE_REF}"

    - name: Build base branch
      run: |
        cargo build --release || true
        if [ -f target/xtensa-esp32s3-espidf/release/esp32-s3-dashboard ]; then
          cp target/xtensa-esp32s3-espidf/release/esp32-s3-dashboard base-binary
        else
          echo "No binary found in base branch"
          touch base-binary
        fi

    # Writes the report to size-report.md, then copies it into the step
    # summary. It cannot be built in $GITHUB_STEP_SUMMARY directly: that
    # variable points at a DIFFERENT file for every step, so the "Comment PR"
    # step below used to read an empty file and the API rejected the comment
    # with "Body cannot be blank".
    - name: Compare sizes
      run: |
        # Host binutils `size` cannot always read an Xtensa ELF; prefer the
        # cross `size` espup installs.
        SIZE_BIN=$(command -v xtensa-esp-elf-size || command -v xtensa-esp32s3-elf-size || command -v size || true)
        detail() {
          if [ -n "$SIZE_BIN" ] && "$SIZE_BIN" current-binary >/dev/null 2>&1; then
            "$SIZE_BIN" current-binary
          else
            echo "bytes: $(stat -c%s current-binary)"
          fi
        }

        {
          echo "## Binary Size Comparison"
          echo ""
          if [ -s base-binary ]; then
            BASE_SIZE=$(stat -c%s base-binary)
            CURRENT_SIZE=$(stat -c%s current-binary)
            DIFF=$((CURRENT_SIZE - BASE_SIZE))
            PERCENT=$(awk "BEGIN {printf \"%.2f\", ($DIFF / $BASE_SIZE) * 100}")

            echo "| Branch | Size | Change |"
            echo "|--------|------|--------|"
            echo "| Base | $(numfmt --to=iec "$BASE_SIZE") | - |"
            echo "| Current | $(numfmt --to=iec "$CURRENT_SIZE") | $(numfmt --to=iec "$DIFF") ($PERCENT%) |"
          else
            echo "No base binary to compare against (the base branch did not build)."
          fi
          echo ""
          echo "### Current Binary Size"
          echo '```'
          detail
          echo '```'
        } > size-report.md

        cat size-report.md >> "$GITHUB_STEP_SUMMARY"

    - name: Comment PR
      if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        script: |
          const fs = require('fs');
          const summary = fs.readFileSync('size-report.md', 'utf8');

          // Find and update existing comment or create new one
          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });

          const botComment = comments.find(comment =>
            comment.user.type === 'Bot' &&
            comment.body.includes('## Binary Size Comparison')
          );

          if (botComment) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: botComment.id,
              body: summary
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: summary
            });
          }
